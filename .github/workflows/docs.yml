name: Documentation

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev ffmpeg

      - name: Install Python dependencies
        run: |
          pip install .[docs,dev]

      - name: Run tests and coverage
        run: |
          python -m pytest --cov=speech2text --cov-report=term-missing

      - name: Check API documentation coverage
        run: |
          interrogate -vv .

      - name: Generate Changelog
        run: |
          git-cliff --output CHANGELOG.md

      - name: Build Documentation
        run: |
          mkdocs build

      - name: Deploy versioned documentation
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            mike deploy --push --update-aliases $TAG latest
            mike set-default --push latest
          else
            mike deploy --push dev
            mike set-default --push dev
          fi
