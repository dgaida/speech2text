# .github/workflows/tests.yml
name: Tests

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '**.rst'
      - '.github/workflows/release.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      full_test:
        description: 'Run full test matrix'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: >-
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_test == 'true'
                || contains(github.event.head_commit.message, '[full-test]')
                || contains(github.event.head_commit.message, '[full ci]'))
              && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
        python-version: >-
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_test == 'true'
                || contains(github.event.head_commit.message, '[full-test]')
                || contains(github.event.head_commit.message, '[full ci]'))
              && fromJSON('["3.9", "3.10", "3.11", "3.12"]')
              || fromJSON('["3.11"]') }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Display test mode
      run: |
        if [[ "${{ github.event_name }}" == "schedule" ]] || \
          [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.full_test }}" == "true" ]] || \
          [[ "${{ contains(github.event.head_commit.message, '[full-test]') }}" == "true" ]] || \
          [[ "${{ contains(github.event.head_commit.message, '[full ci]') }}" == "true" ]]; then
          echo "🔥 Running FULL test suite on all platforms"
        else
          echo "⚡ Running QUICK tests (ubuntu-latest, Python 3.11 only)"
        fi
      shell: bash

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Install system dependencies for audio libraries
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-pyaudio

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install portaudio

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        # PyAudio wheels are available for Windows, no action needed
        echo "Using PyAudio wheels for Windows"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        pytest -v --cov=speech2text --cov-report=xml --cov-report=term-missing
      continue-on-error: false

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=80

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
