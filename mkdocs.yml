site_name: Speech2Text
site_description: Professionelle Spracherkennung mit OpenAI Whisper
site_author: Daniel Gaida
repo_url: https://github.com/dgaida/speech2text
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      default_language: de
      languages:
        de:
          name: Deutsch
          link: /de/
          build_site: true
        en:
          name: English
          link: /en/
          build_site: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            import_outline_revealed: true
  - mermaid2:
      arguments:
        theme: 'default'
  - mike:
      alias_type: symlink

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  version:
    provider: mike

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Usage: usage.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Development:
      - Development Overview: development.md
      - Docstring Style Guide: development/docstring-style-guide.md
      - Release Process: development/release-process.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
  - Metrics: metrics.md
