[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech2text"
version = "0.1.1"
description = "Provides speech-to-text (ASR) capabilities using OpenAI's Whisper model."
authors = [
    { name = "Daniel Gaida", email = "daniel.gaida@th-koeln.de" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "sounddevice>=0.4.0",
    "transformers",
    "whisper-mic",
    "scipy",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-mermaid2-plugin>=0.6.4",
    "mike>=2.1.0",
    "mkdocs-static-i18n>=1.2.0",
    "interrogate>=1.7.0",
    "git-cliff>=2.12.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/dgaida/speech2text"
Repository = "https://github.com/dgaida/speech2text"

[tool.setuptools]
packages = ["speech2text"]

[tool.setuptools.package-data]
speech2text = ["py.typed"]

[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "whisper_mic.*",
    "sounddevice.*",
    "scipy.*",
    "torch.*"
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["speech2text"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "speech2text/__main__.py",
]

[tool.coverage.report]
precision = 2
fail_under = 80.0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
fail-under = 95
exclude = ["setup.py", "docs", "build", "tests"]
ignore-regex = ["^get$", "^mock_.*", ".*Base$"]
verbose = 2
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
