[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech2text"
version = "0.1.0"
description = "Provides speech-to-text (ASR) capabilities using OpenAI's Whisper model."
authors = [
    { name = "Daniel Gaida", email = "daniel.gaida@th-koeln.de" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "sounddevice>=0.4.0",
    "transformers",
    "whisper-mic",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/dgaida/speech2text"
Repository = "https://github.com/dgaida/speech2text"

[tool.setuptools]
packages = ["speech2text"]

[tool.setuptools.package-data]
speech2text = ["py.typed"]

[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL"]
ignore = ["PLR0913"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "whisper_mic.*",
    "sounddevice.*",
    "scipy.*",
    "torch.*"
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["speech2text"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
precision = 2
fail_under = 80.0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
